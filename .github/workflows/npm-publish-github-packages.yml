# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Push Node.js Package to Github

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish-gpr:
    runs-on: agvolution-k8s
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
      # The k8s runner image has no Yarn; corepack provides it (packageManager / yarnPath).
      - name: Enable Yarn
        run: corepack enable
      - name: Setup .yarnrc.yml
        run: |
          yarn config set npmScopes.agvolution.npmRegistryServer "https://npm.pkg.github.com"
          yarn config set npmScopes.agvolution.npmAlwaysAuth true
          yarn config set npmScopes.agvolution.npmAuthToken $NPM_AUTH_TOKEN
        env:
          NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com/
      - name: Build and publish
        run: |
          yarn build
          yarn npm publish
